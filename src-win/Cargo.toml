[package]
name = "src-win"
version = "1.0.0"
edition = "2021"
license = "Apache-2.0"
description = "Windows runner for DRQ Complete"

[build-dependencies]
cc = "1.0"

[[bin]]
name = "src-win"
path = "src/main.rs"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
